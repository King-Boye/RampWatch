[package]
name = "rampwatch-backend"
version = "0.1.0"
edition.workspace = true
license.workspace = true
default-run = "rampwatch"

[[bin]]
name = "rampwatch"
path = "src/main.rs"

[lib]
name = "rampwatch"
path = "src/lib.rs"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace", "limit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
validator = { version = "0.21", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "macros", "migrate"] }
reqwest = { version = "0.13", features = ["json"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
redis = { version = "1.3", features = ["aio", "tokio-comp", "connection-manager"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
dotenvy = "0.15"
argon2 = "0.6.0"
dashmap = "6.2"
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
csv = "1.4"
url = "2.5"

[dev-dependencies]
http-body-util = "0.1"
