# OSV-Scanner config, used by .github/workflows/security.yml.
# OSV reads Cargo.lock, so it sees sqlx's unused MySQL driver (see SECURITY.md).

# rsa Marvin attack (RUSTSEC-2023-0071 / GHSA-c38w-74pg-36hr). OSV matches it
# by the GitHub id and treats the RustSec id as an alias.
[[IgnoredVulns]]
id = "GHSA-c38w-74pg-36hr"
reason = "rsa is in Cargo.lock only via sqlx's unused MySQL driver and is never compiled (cargo tree -i rsa is empty)."
