version: 2
updates:
  # Rust crates for the whole workspace (backend + contracts).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Lagos
    open-pull-requests-limit: 10
    labels: [dependencies, rust]
    commit-message:
      prefix: "deps"
    groups:
      # One PR for all minor and patch bumps; majors arrive one by one.
      rust-minor-and-patch:
        update-types: [minor, patch]

  # Pinned GitHub Actions in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Lagos
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
