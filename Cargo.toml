[workspace]
resolver = "2"
members = ["backend", "contracts/registry"]

[workspace.package]
edition = "2021"
license = "MIT"

# Soroban contracts need a small, panic-abort release build.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
